# Pipeline d'intégration continue : lint, typecheck, tests (avec couverture) et build.
# Suite purement unitaire (tests/unit/) : aucun service MongoDB requis dans cette CI.
name: ci
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # Déclenchement manuel temporaire pour valider l'ajout de gitleaks sur
  # ci/github-actions (develop n'existe pas encore — tâche 13). Retiré une
  # fois le run vert confirmé.
  workflow_dispatch:

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Vérification des types
        run: npm run typecheck
      # Les seuils de couverture (70 % statements/functions/lines, 65 % branches) sont
      # définis dans jest.config.js et font échouer ce job d'eux-mêmes : rien à dupliquer ici.
      - name: Tests et couverture
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # Job séparé du job « Qualité et tests » — dont ni le nom ni la structure ne
  # doivent changer (référencés par les règles de protection de branche).
  secrets:
    name: Détection de secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # Historique propre à ce dépôt : aucune allowlist nécessaire.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
